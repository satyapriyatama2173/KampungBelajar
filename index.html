<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS - Kampunge Arek Suroboyo (KAS) RPA</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        #map { width: 100%; height: 100%; z-index: 10; }
        .add-mode-active #map { cursor: crosshair !important; }
        .custom-marker-container { display: flex; justify-content: center; align-items: center; }
        .marker-pin {
            width: 35px; height: 35px; border-radius: 50% 50% 50% 0; position: absolute;
            transform: rotate(-45deg); left: 50%; top: 50%; margin: -17px 0 0 -17px;
            border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .marker-pin i { transform: rotate(45deg); display: block; text-align: center; color: white; font-size: 16px; line-height: 31px; }
        .custom-select-filter {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234b5563' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: right 1rem center; background-size: 1em; padding-right: 2.5rem;
        }
        @keyframes bounceIn { 0% { opacity: 0; transform: scale(0.3); } 100% { opacity: 1; transform: scale(1); } }
        .animate-bounce-in { animation: bounceIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <header class="bg-blue-800 text-white shadow-md p-4 z-50 fixed w-full top-0">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-map-location-dot text-2xl text-blue-200"></i>
                <h1 class="text-xl font-bold tracking-wide">Kampung Belajar Kelurahan Wonokusumo</h1>
            </div>
        </div>
    </header>

    <section id="beranda" class="pt-28 pb-8 px-4 text-center">
        <div class="container mx-auto max-w-4xl">
            <h2 class="text-3xl md:text-4xl font-extrabold text-blue-900 mb-2">Peta Kampung Belajar Kelurahan Wonokusumo</h2>
            <p class="text-gray-600">Sistem informasi geografis dari sebaran program kampung belajar wilayah Kelurahan Wonokusumo</p>
        </div>
    </section>

    <section class="pb-16 px-4">
        <div class="container mx-auto">
            <div class="mb-4 flex flex-wrap justify-between items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-4">
                    <select id="filter-kategori" onchange="applyFilter()" class="custom-select-filter border-2 border-blue-400 rounded-xl px-4 py-2.5 font-bold text-gray-800 outline-none cursor-pointer bg-white shadow-sm min-w-[220px]">
                        <option value="Semua">Tampilkan Semua</option>
                        <option value="Sinau Bareng">Sinau Bareng</option>
                        <option value="TPQ/TPA">TPQ/TPA</option>
                        <option value="Paud">Paud</option>
                        <option value="TK">TK</option>
                        <option value="Panti Asuhan">Panti Asuhan</option>
                        <option value="Bimbel">Bimbel</option>
                    </select>
                    <span id="total-kampung" class="font-bold text-blue-700 bg-blue-50 px-4 py-2.5 rounded-xl border border-blue-100 shadow-sm">0 Titik</span>
                </div>
                <div class="flex gap-2">
                    <button onclick="bukaModalManual()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md">INPUT MANUAL</button>
                    <button id="btn-toggle-add" onclick="toggleAddMode()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition-all shadow-md"><span id="btn-add-text">KLIK DI PETA</span></button>
                </div>
            </div>

            <div class="h-[70vh] w-full rounded-2xl shadow-2xl border border-gray-200 overflow-hidden relative">
                <div id="add-mode-alert" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-6 py-2 rounded-full shadow-lg z-[50] text-xs font-bold hidden animate-pulse">MODE PILIH LOKASI: Klik pada peta!</div>
                <div id="map"></div>
            </div>
        </div>
    </section>

    <div id="modal-tambah-titik" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4" onclick="tutupModalJikaBackground(event)">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative animate-bounce-in max-h-[90vh] overflow-y-auto">
            <button onclick="tutupModalTambah()" class="absolute top-4 right-4 text-gray-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Form Tambah Data</h3>
            <form id="form-tambah-titik" onsubmit="simpanTitikBaru(event)" class="space-y-4">
                <div class="flex gap-4">
                    <div class="w-1/2"><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Latitude</label><input type="number" step="any" id="input-lat" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none"></div>
                    <div class="w-1/2"><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Longitude</label><input type="number" step="any" id="input-lng" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none"></div>
                </div>
                <div><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Nama Instansi</label><input type="text" id="input-nama" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400 outline-none"></div>
                
                <div class="flex gap-4">
                    <div class="w-1/2"><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Hari Pelaksanaan</label><input type="text" id="input-hari" placeholder="Senin - Kamis" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none"></div>
                    <div class="w-1/2"><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Jam Operasional</label><input type="text" id="input-jam" placeholder="16:00 - 18:00" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none"></div>
                </div>

                <div class="flex gap-4">
                    <div class="w-1/2">
                        <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Kategori</label>
                        <select id="input-kategori" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none">
                            <option value="Sinau Bareng">Sinau Bareng</option><option value="TPQ/TPA">TPQ/TPA</option><option value="Paud">Paud</option><option value="TK">TK</option><option value="Panti Asuhan">Panti Asuhan</option><option value="Bimbel">Bimbel</option>
                        </select>
                    </div>
                    <div class="w-1/2"><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Jumlah Anak</label><input type="number" id="input-jumlah-anak" placeholder="0" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none"></div>
                </div>

                <div class="flex gap-4">
                    <div class="w-full"><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Status</label><select id="input-status" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none"><option value="Aktif">Aktif</option><option value="Tidak Aktif">Tidak Aktif</option></select></div>
                </div>

                <div><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Alamat</label><input type="text" id="input-alamat" required class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none"></div>
                
                <div><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Deskripsi</label><textarea id="input-deskripsi" rows="2" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm outline-none resize-none focus:ring-2 focus:ring-blue-400"></textarea></div>

                <div><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest text-red-500">Kendala</label><textarea id="input-kendala" rows="2" class="w-full border border-red-200 rounded-lg px-3 py-2 text-sm outline-none resize-none focus:ring-2 focus:ring-red-400"></textarea></div>

                <div>
                    <input type="file" id="input-foto" accept="image/*" class="hidden" onchange="previewFoto(event)">
                    <div class="border-2 border-dashed border-gray-200 rounded-xl p-3 text-center cursor-pointer hover:bg-gray-50" onclick="document.getElementById('input-foto').click()">
                        <div id="foto-placeholder" class="text-xs text-gray-400">Upload Foto</div>
                        <img id="foto-preview" src="" class="hidden mx-auto max-h-32 rounded-lg">
                    </div>
                </div>
                <button id="btn-submit" type="submit" class="w-full bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all hover:bg-blue-800">SIMPAN KE DATABASE</button>
            </form>
        </div>
    </div>

        const SUPABASE_URL = 'https://isjuziwdhyekwfoxyuxg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzanV6aXdkaHlla3dmb3h5dXhnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxMzk3NjEsImV4cCI6MjA5MzcxNTc2MX0.5_c2B_7g8LHconQBEF_xdNcAeT2G6oBeMn3PofA7MNI';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let kasData = []; let markers = {};
        const streetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' });
        const satelliteMap = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { attribution: 'Google Satellite' });

        const mapInstance = L.map('map', { center: [-7.2354, 112.7588], zoom: 14, layers: [streetMap] });

        const batasRWLayer = L.geoJSON(dataBatasRW, {
            style: { color: "#ef4444", weight: 2, opacity: 0.6, fillOpacity: 0.05, dashArray: '3' },
            onEachFeature: (f, l) => { if (f.properties && f.properties.RW) l.bindPopup("Wilayah " + f.properties.RW); }
        }).addTo(mapInstance);

        L.control.layers({ "Peta Jalan": streetMap, "Satelit": satelliteMap }, { "Batas RW": batasRWLayer }).addTo(mapInstance);

        const symbology = {
            "Sinau Bareng": { color: "#3b82f6", icon: "fa-book-reader" }, "Panti Asuhan": { color: "#ec4899", icon: "fa-house" }, "Paud": { color: "#f59e0b", icon: "fa-child" }, "TK": { color: "#8b5cf6", icon: "fa-graduation-cap" }, "TPQ/TPA": { color: "#ef4444", icon: "fa-mosque" }, "Bimbel": { color: "#06b6d4", icon: "fa-pencil" }, "Default": { color: "#6b7280", icon: "fa-map-marker-alt" }
        };

        function createCustomIcon(category) {
            const config = symbology[category] || symbology["Default"];
            return L.divIcon({ html: `<div class="custom-marker-container"><div class="marker-pin" style="background: ${config.color};"><i class="fa-solid ${config.icon}"></i></div></div>`, className: '', iconSize: [35, 35], iconAnchor: [17, 35], popupAnchor: [0, -35] });
        }

        function applyFilter() { const selected = document.getElementById('filter-kategori').value; renderMarkers(selected === "Semua" ? kasData : kasData.filter(i => i.kategori === selected)); }

        async function fetchDatabaseData() { const { data } = await _supabase.from('kas_data').select('*').order('id', { ascending: true }); kasData = data || []; applyFilter(); }

        function renderMarkers(dataToRender) {
            for (let id in markers) { mapInstance.removeLayer(markers[id]); delete markers[id]; }
            dataToRender.forEach(item => {
                const marker = L.marker([item.lat, item.lng], { icon: createCustomIcon(item.kategori) }).addTo(mapInstance);
                const color = (symbology[item.kategori] || symbology["Default"]).color;
                
                // UPDATE: Menampilkan data tambahan di Popup
                marker.bindPopup(`
                    <div style="width:220px; font-family:sans-serif;">
                        ${item.foto_url ? `<img src="${item.foto_url}" style="width:100%;height:110px;object-fit:cover;border-radius:10px;margin-bottom:8px;">` : ''}
                        <h4 style="font-weight:800;margin:0;font-size:15px;color:#1e3a8a;">${item.name}</h4>
                        <p style="font-size:10px;color:#64748b;margin:4px 0;">📍 ${item.alamat}</p>
                        
                        <div style="margin:10px 0; padding:8px; background:#f8fafc; border-radius:8px; font-size:11px; color:#334155;">
                            <div style="margin-bottom:4px;"><b>📅 Hari:</b> ${item.hari_pelaksanaan || '-'}</div>
                            <div style="margin-bottom:4px;"><b>⏰ Jam:</b> ${item.jam_operasional || '-'}</div>
                            <div style="margin-bottom:4px;"><b>👥 Anak:</b> ${item.jumlah_anak || 0} Orang</div>
                            <div style="color:#dc2626;"><b>⚠️ Kendala:</b> ${item.kendala || '-'}</div>
                        </div>

                        <p style="font-size:11px;color:#475569;margin-bottom:10px;line-height:1.4;">${item.description || ''}</p>
                        
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <span style="font-size:9px;background:${color};color:white;padding:3px 8px;border-radius:5px;font-weight:bold;">${item.kategori}</span>
                            <button onclick="hapusTitik(${item.id})" style="color:#ef4444;font-size:10px;cursor:pointer;font-weight:bold;background:none;border:none;">HAPUS</button>
                        </div>
                    </div>
                `);
                markers[item.id] = marker;
            });
            document.getElementById('total-kampung').innerText = `${dataToRender.length} Titik`;
        }

        async function simpanTitikBaru(e) {
            e.preventDefault(); const btn = document.getElementById('btn-submit'); btn.disabled = true; btn.innerText = "SEDANG MENYIMPAN...";
            try {
                let fotoUrl = null; const file = document.getElementById('input-foto').files[0];
                if (file) {
                    const fileName = `foto_${Date.now()}.${file.name.split('.').pop()}`;
                    await _supabase.storage.from('kas-photos').upload(`kampung/${fileName}`, file);
                    fotoUrl = _supabase.storage.from('kas-photos').getPublicUrl(`kampung/${fileName}`).data.publicUrl;
                }
                
                // UPDATE: Menambahkan field baru ke query Insert
                await _supabase.from('kas_data').insert([{ 
                    name: document.getElementById('input-nama').value, 
                    alamat: document.getElementById('input-alamat').value, 
                    kategori: document.getElementById('input-kategori').value, 
                    status: document.getElementById('input-status').value, 
                    description: document.getElementById('input-deskripsi').value, 
                    
                    hari_pelaksanaan: document.getElementById('input-hari').value,
                    jam_operasional: document.getElementById('input-jam').value,
                    jumlah_anak: parseInt(document.getElementById('input-jumlah-anak').value) || 0,
                    kendala: document.getElementById('input-kendala').value,
                    
                    foto_url: fotoUrl, 
                    lat: parseFloat(document.getElementById('input-lat').value), 
                    lng: parseFloat(document.getElementById('input-lng').value) 
                }]);

                tutupModalTambah(); await fetchDatabaseData();
            } catch (err) { alert("Gagal Simpan Data!"); console.error(err); } finally { btn.disabled = false; btn.innerText = "SIMPAN KE DATABASE"; }
        }

        async function hapusTitik(id) { if (confirm("Hapus?")) { await _supabase.from('kas_data').delete().eq('id', id); fetchDatabaseData(); } }

        let isAddMode = false;
        function toggleAddMode() { isAddMode = !isAddMode; document.getElementById('add-mode-alert').classList.toggle('hidden', !isAddMode); document.getElementById('btn-add-text').innerText = isAddMode ? "BATAL" : "KLIK DI PETA"; }
        mapInstance.on('click', e => { if (!isAddMode) return; document.getElementById('input-lat').value = e.latlng.lat.toFixed(6); document.getElementById('input-lng').value = e.latlng.lng.toFixed(6); toggleAddMode(); bukaModalManual(); });
        function bukaModalManual() { document.getElementById('modal-tambah-titik').classList.replace('hidden', 'flex'); }
        function tutupModalTambah() { document.getElementById('modal-tambah-titik').classList.replace('flex', 'hidden'); document.getElementById('form-tambah-titik').reset(); document.getElementById('foto-preview').classList.add('hidden'); document.getElementById('foto-placeholder').classList.remove('hidden'); }
        function previewFoto(e) { const f = e.target.files[0]; if (f) { const r = new FileReader(); r.onload = x => { document.getElementById('foto-preview').src = x.target.result; document.getElementById('foto-preview').classList.remove('hidden'); document.getElementById('foto-placeholder').classList.add('hidden'); }; r.readAsDataURL(f); } }
        function tutupModalJikaBackground(e) { if (e.target.id === 'modal-tambah-titik') tutupModalTambah(); }
        
        fetchDatabaseData();
    </script>
